name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static portfolio
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail
          if [ -d dist/client ]; then
            SITE_DIR="dist/client"
          elif [ -d dist ]; then
            SITE_DIR="dist"
          else
            echo "Build output folder not found"
            exit 1
          fi

          touch "$SITE_DIR/.nojekyll"
          if [ -f "$SITE_DIR/index.html" ]; then
            cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          fi

          mkdir -p _site
          cp -R "$SITE_DIR"/. _site/
          echo "Built site files:"
          find _site -maxdepth 3 -type f | sort | head -200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
