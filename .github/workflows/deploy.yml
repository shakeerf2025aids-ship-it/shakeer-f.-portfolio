name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static portfolio
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          if [ -d dist/client ]; then
            SITE_DIR="dist/client"
          elif [ -d dist ]; then
            SITE_DIR="dist"
          else
            echo "Build output folder not found"
            exit 1
          fi

          touch "$SITE_DIR/.nojekyll"

          # Keep client-side fallback for routes if a static route isn't found.
          if [ -f "$SITE_DIR/index.html" ]; then
            cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          fi

          echo "Publishing directory: $SITE_DIR"
          ls -la "$SITE_DIR"
          mkdir -p _site
          cp -R "$SITE_DIR"/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
